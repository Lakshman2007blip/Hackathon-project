<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartSlate - offline adaptive learning</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#14233C">
<style>
:root{
  --bg:#F3F6FA; --ink:#14233C; --muted:#51607A; --card:#FFFFFF; --line:#CBD5E1; --grid:#E6ECF3;
  --accent:#F4B400; --accent-ink:#14233C; --ok:#1E7B52; --warn:#9A6B00; --bad:#B23A2E; --focus:#1F5FBF;
}
:root[data-theme="contrast"]{
  --bg:#000; --ink:#fff; --muted:#e8e8e8; --card:#000; --line:#fff; --grid:#2a2a2a;
  --accent:#FFE600; --accent-ink:#000; --ok:#4DFF9A; --warn:#FFE600; --bad:#FF8A7A; --focus:#00E5FF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55;
  font-family:"Noto Sans","Noto Sans Devanagari","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:8px 12px;z-index:10}
.skip:focus{left:8px}

header.top{background:#14233C;color:#fff;padding:12px 0}
:root[data-theme="contrast"] header.top{background:#000;border-bottom:2px solid #fff}
.bar-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:.2px;margin:0}
.brand small{display:block;font-size:.78rem;font-weight:400;opacity:.85}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools label{font-size:.85rem}
select,input[type=text],input[type=password],input[type=search]{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:6px;padding:8px 10px;min-height:44px}
:root[data-theme="contrast"] select,:root[data-theme="contrast"] input[type=text],:root[data-theme="contrast"] input[type=password],:root[data-theme="contrast"] input[type=search]{background:#000;color:#fff;border-color:#fff}
.chip{font:inherit;font-size:.9rem;min-height:44px;min-width:44px;padding:6px 12px;border-radius:6px;border:2px solid #fff;background:transparent;color:#fff;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.status{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 0;font-size:.9rem}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:2px 12px;background:var(--card)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
.pill[data-on="true"] .dot{background:var(--ok)}
.sync-msg{color:var(--muted);margin:0}

nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-top:4px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:600;background:none;border:0;border-bottom:4px solid transparent;color:var(--muted);padding:12px 14px;min-height:44px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding:20px 0 56px}
h1,h2{line-height:1.25;margin:0 0 8px}
h1{font-size:1.7rem}
h2{font-size:1.3rem}
h3{font-size:1.05rem;margin:20px 0 8px}
.lead{max-width:62ch;color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}

/* The question card looks like a squared maths notebook page */
.sheet{background-color:var(--card);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;border:2px solid var(--line);border-left:6px solid var(--bad);border-radius:6px;padding:20px 20px 20px 22px}
fieldset{border:0;margin:0;padding:0}
legend{font-size:1.2rem;font-weight:600;padding:0;margin-bottom:14px;max-width:60ch}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:block;padding:12px 14px;min-height:48px;border:2px solid var(--ink);border-radius:8px;background:var(--card);font-size:1.1rem;font-weight:600}
.opt input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-ink)}
.opt input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.opt.right span{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.opt.wrong span{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}

.btn{font:inherit;font-weight:700;min-height:48px;padding:10px 20px;border-radius:8px;border:2px solid var(--ink);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.secondary{background:var(--card);color:var(--ink)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.small{min-height:44px;padding:6px 14px;font-size:.92rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.field{display:grid;gap:6px;margin-bottom:14px;max-width:420px}
.check{display:flex;gap:10px;align-items:flex-start;max-width:60ch;margin-bottom:14px}
.check input{width:24px;height:24px;margin-top:2px;flex:none}
.msg{min-height:1.5em;margin:10px 0 0;font-weight:600}
.msg.err{color:var(--bad)}
.msg.good{color:var(--ok)}

.meter{display:grid;grid-template-columns:minmax(120px,200px) 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.meter:first-of-type{border-top:0}
.meter .name{font-weight:600}
.bar{height:16px;border-radius:8px;background:var(--grid);border:1px solid var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--bad)}
.bar span.mid{background:var(--warn)}
.bar span.hi{background:var(--ok)}
@media (prefers-reduced-motion:no-preference){.bar span{transition:width .5s ease}}
.tag{font-size:.82rem;color:var(--muted);font-weight:600}
.here{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 8px;font-size:.8rem;font-weight:700;margin-left:6px}
.meter-actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
@media (max-width:620px){.meter{grid-template-columns:1fr}.meter-actions{justify-content:flex-start}}

table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700}
.scroll{overflow-x:auto}
ul.plain{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.progress{height:8px;border-radius:4px;background:var(--grid);margin-bottom:16px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--ink)}
.feedback{font-weight:700;margin:14px 0 0}
.feedback.ok{color:var(--ok)}
.feedback.no{color:var(--bad)}
.note{color:var(--muted);font-size:.9rem}
[hidden]{display:none!important}
.userbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:12px}
.userbar #who{font-weight:600}
.userbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:8px;margin-bottom:16px}
.seg .btn[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
:root[data-theme="contrast"] .btn.danger{background:#000;color:var(--bad);border-color:var(--bad)}
.check.small{font-size:.92rem;margin-bottom:12px}
.check.small input{width:20px;height:20px}
details.card summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
input[type=search]{min-width:200px;flex:1}
</style>
</head>
<body>
<a class="skip" href="#app" id="skip">Skip to content</a>

<header class="top">
  <div class="wrap bar-row">
    <div class="brand">SmartSlate<small>Offline adaptive learning</small></div>
    <div class="tools">
      <label for="lang" id="lblLang">Language</label>
      <select id="lang">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="ta">தமிழ்</option>
      </select>
      <button class="chip" id="btnSmall" type="button">A&minus;</button>
      <button class="chip" id="btnLarge" type="button">A+</button>
      <button class="chip" id="btnContrast" type="button" aria-pressed="false">High contrast</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="status">
    <span class="pill" id="net" data-on="true"><span class="dot" aria-hidden="true"></span><span id="netText">Online</span></span>
    <span id="pend">0</span>
    <button class="btn secondary small" id="btnSync" type="button">Sync now</button>
    <button class="btn secondary small" id="btnInstall" type="button" hidden>Install app</button>
    <p class="sync-msg" id="syncMsg" role="status" aria-live="polite"></p>
  </div>
  <nav class="tabs" aria-label="Main">
    <button type="button" data-tab="welcome" id="tabStudent">Student</button>
    <button type="button" data-tab="teacher" id="tabTeacher">Teacher</button>
    <button type="button" data-tab="privacy" id="tabPrivacy">Privacy and standards</button>
  </nav>
  <div class="userbar" id="userbar" hidden>
    <span id="who"></span>
    <span class="actions">
      <button type="button" class="btn secondary small" id="btnProfile">My profile</button>
      <button type="button" class="btn secondary small" id="btnLogout">Log out</button>
    </span>
  </div>
  <main id="app" tabindex="-1"></main>
</div>

/* ---------- Helpers ---------- */

const T = (k, v) => {

  if (v) for (const x in v) s = s.split("{" + x + "}").join(v[x]);
  return s;
};
const tr = o => o[lang()] || o.en;
const topicName = id => tr(TOPICS.find(t => t.id === id).n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = x => Math.round(x * 100);
const fill = f => f >= MASTERY_GOAL ? "hi" : f >= 0.5 ? "mid" : "";
const level = f => f >= MASTERY_GOAL ? T("strong") : f >= 0.5 ? T("gettingThere") : T("needsWork");
const serverAvailable = () => !!SYNC_URL && location.protocol.startsWith("http");

/* ---------- Passwords: hashed in the browser, never stored or sent in plain text ---------- */
const enc = new TextEncoder();
const toHex = buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
const fromHex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
const randHex = n => toHex(crypto.getRandomValues(new Uint8Array(n)));
const cryptoOK = () => !!(window.crypto && crypto.subtle);
async function pbkdf2(password, saltHex, iter = PBKDF2_ITER) {
  const key = await crypto.subtle.importKey("raw", enc.encode(password.normalize("NFKC")), "PBKDF2", false, ["deriveBits"]);
  return toHex(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt: fromHex(saltHex), iterations: iter}, key, 256));
}
async function sha256Hex(s) { return toHex(await crypto.subtle.digest("SHA-256", enc.encode(s))); }

// Slows down guessing on this device: 5 wrong tries = 30 second wait.
const fails = {};
function waitLeft(key) { const f = fails[key]; return f && f.until > Date.now() ? Math.ceil((f.until - Date.now()) / 1000) : 0; }
function failed(key) { const f = fails[key] || (fails[key] = {n:0, until:0}); if (++f.n >= 5) { f.n = 0; f.until = Date.now() + 30000; } }
function succeeded(key) { delete fails[key]; }

/* ---------- Learning model ---------- */
function tally(attempts) {
  const per = {}; TOPICS.forEach(t => per[t.id] = {c:0, n:0});
  attempts.forEach(a => { per[a.topic].n++; if (a.ok) per[a.topic].c++; });
  const c = attempts.filter(a => a.ok).length;
  return {per, c, n: attempts.length};
}
const mastery = p => (p.c + 1) / (p.n + 2);

/* ---------- Sample class for the teacher demo (deterministic) ---------- */
function demoClass() {
  let a = 20260901;
  const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const names = ["Arun","Meena","Ravi","Divya","Karthik","Priya","Sana","Imran","Lakshmi","Vikram","Anitha","Rohan","Fatima","Suresh","Kavya","Manoj","Nisha","Faisal","Deepa","Aman","Sneha","Bala","Pooja","Irfan"];
  const bias = {int:.75, fra:.55, equ:.62, are:.42, rat:.35};
  return names.map((name, i) => {
    const ability = 0.25 + rnd() * 0.6, attempts = [];
    TOPICS.forEach(t => {
      const p = Math.min(.95, Math.max(.05, ability * .6 + bias[t.id] * .5 + (rnd() - .5) * .2));
      for (let k = 0; k < 4; k++) attempts.push({topic: t.id, ok: rnd() < p});
    });
    return {id:"demo" + i, name, attempts, demo:true};
  });
}
const DEMO = demoClass();

/* ---------- Session (memory only, so closing the tab logs everyone out) ---------- */

const myAttempts = () => db.attempts.filter(a => a.sid === session.sid);
const STUDENT_VIEWS = ["welcome", "diag", "results", "practice", "profile"];

function classRoster() {
  const remote = (state.remote || []).map(s => {
    const attempts = [];
    TOPICS.forEach(t => { const x = s.topics[t.id]; if (x) for (let k = 0; k < x.n; k++) attempts.push({topic: t.id, ok: k < x.c}); });
    return {id: s.id, name: s.name, attempts, demo:false};
  });
  const seen = new Set(remote.map(s => s.id));
  const real = db.students.filter(s => !seen.has(s.id))
    .map(s => ({id:s.id, name:s.name, attempts: db.attempts.filter(a => a.sid === s.id), demo:false}));
  return remote.concat(real, db.settings.demo ? DEMO : []).filter(s => s.attempts.length);
}
function summaries() {
  return classRoster().map(s => {
    const t = tally(s.attempts);
    const worst = TOPICS.map(x => ({id:x.id, f: t.per[x.id].n ? t.per[x.id].c / t.per[x.id].n : 1})).sort((a, b) => a.f - b.f)[0];
    return {name:s.name, f: t.n ? t.c / t.n : 0, c:t.c, n:t.n, worst:worst.id, per:t.per};
  });
}

  state.diag = {i:d, order:DIAG_ORDER.slice(), opts:[]};
  return "diag";
}
function go(view) {
  state.view = view; state.sel = null; state.focus = true;
  if (view === "teacher" && !session.teacher) prepareTeacher();
  render();
  if (view === "teacher" && session.teacher) loadRemote();
}

/* ---------- Server calls ---------- */
async function api(payload) {
  const r = await fetch(SYNC_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload)});
  return r.json();
}
async function prepareTeacher() {
  if (db.teacher) { state.tGate = {mode:"login", salt: db.teacher.salt}; return; }
  if (!serverAvailable()) { state.tGate = {mode:"setup", local:true}; return; }
  if (!navigator.onLine) { state.tGate = {mode:"offline"}; return; }
  state.tGate = {mode:"checking"};
  try {
    const j = await api({action:"teacherStatus"});
    state.tGate = j.exists ? {mode:"login", salt:j.salt} : {mode:"setup"};
  } catch { state.tGate = {mode:"offline"}; }
  if (state.view === "teacher" && !session.teacher) { state.focus = false; render(); }
}
async function loadRemote() {
  if (!serverAvailable() || !navigator.onLine || !session.teacher || !session.th) return;
  try {
    const j = await api({action:"class", th: session.th});
    if (j.status === 401) { lockTeacher(false); db.teacher = null; save(); flash(T("serverRejected")); go("teacher"); return; }
    if (!j.ok) return;
    state.remote = j.students;
    if (state.view === "teacher") { state.focus = false; render(); }
  } catch {}
}
async function syncNow(silent) {
  const say2 = t => { if (!silent || t === T("syncFail")) $("#syncMsg").textContent = t; };
  const pendIds = db.attempts.filter(a => !a.synced);
  const renames = db.students.filter(s => s.renamePending).map(s => ({sid:s.id, name:s.name}));
  const deletes = (db.pendingDeletes || []).slice();
  if (!navigator.onLine) { say2(T("syncOffline")); return; }
  if (!pendIds.length && !renames.length && !deletes.length) { say2(T("syncedMsg")); return; }
  try {
    const nameOf = id => { const s = db.students.find(x => x.id === id); return s ? s.name : ""; };
    const records = pendIds.map(a => ({sid:a.sid, name:nameOf(a.sid), qid:a.qid, topic:a.topic, ok:a.ok, ts:a.ts}));
    if (serverAvailable()) {
      const j = await api({action:"sync", records, renames, deletes});
      if (!j.ok) throw new Error(j.error || "bad response");
    } else await new Promise(r => setTimeout(r, 600));   // simulated server when opened as a plain file
    pendIds.forEach(a => a.synced = true);
    db.students.forEach(s => { if (s.renamePending) delete s.renamePending; });
    db.pendingDeletes = (db.pendingDeletes || []).filter(id => !deletes.includes(id));
    save(); say2(T("syncedMsg"));
  } catch { say2(T("syncFail")); }
  netStatus();
}

function questionCard(q, opts, checked) {
  const items = opts.map((o, i) => {
    let cls = "opt";
    if (checked) { if (o === q.a) cls += " right"; else if (state.sel === i) cls += " wrong"; }
    return `<label class="${cls}"><input type="radio" name="opt" value="${i}" ${state.sel === i ? "checked" : ""} ${checked ? "disabled" : ""}><span>${esc(o)}</span></label>`;
  }).join("");
  return `<div class="sheet"><fieldset><legend>${esc(tr(q.s))}</legend><div class="opts">${items}</div></fieldset></div>`;
}

const csvCell = v => { let s = String(v); if (/^[=+\-@]/.test(s)) s = "'" + s; return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function exportCSV() {
  const head = ["Student", "Overall %", "Answered"].concat(TOPICS.map(t => t.n.en + " %"));
  const rows = summaries().sort((a, b) => a.name.localeCompare(b.name)).map(s =>
    [s.name, pct(s.f), s.n].concat(TOPICS.map(t => s.per[t.id].n ? pct(s.per[t.id].c / s.per[t.id].n) : "")));
  const csv = [head].concat(rows).map(r => r.map(csvCell).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], {type:"text/csv;charset=utf-8"}));
  a.download = "smartslate-class.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- Account actions ---------- */
const cleanNick = s => s.trim().replace(/\s+/g, " ");
function nickError(name, exceptId) {
  if (!NICK_RE.test(name)) return T("errNick");
  if (db.students.some(s => s.id !== exceptId && s.name.toLowerCase() === name.toLowerCase())) return T("errNickTaken");
  return null;
}
function pwError(pw, pw2, min) {
  if (pw.length < min) return T("errPwShort", {n: min});
  if (pw2 !== undefined && pw !== pw2) return T("errPwMatch");
  return null;
}
const lockMsg = key => { const w = waitLeft(key); return w ? T("errLocked", {s: w}) : null; };

function enterStudent(s) {
  session.sid = s.id; touch();
  go(studentHome());
}
function logoutStudent(auto) {
  session.sid = null; state.diag = state.practice = null;
  if (auto) flash(T("idleOut"));
  if (STUDENT_VIEWS.includes(state.view)) go("welcome"); else render();
}
function lockTeacher(auto) {
  session.teacher = false; session.th = null; state.remote = null;
  if (auto) flash(T("idleOut"));
  prepareTeacher();
  if (state.view === "teacher") go("teacher"); else render();
}
function removeStudent(id) {
  db.students = db.students.filter(s => s.id !== id);
  db.attempts = db.attempts.filter(a => a.sid !== id);
  db.pendingDeletes = (db.pendingDeletes || []).concat(id);
  save(); netStatus();
  if (navigator.onLine) syncNow(true);
}

const forms = {
 async login(f) {
  if (!cryptoOK()) return say("#formMsg", T("errCrypto"));
  const s = db.students.find(x => x.id === f.elements.sid.value), pw = f.elements.pw.value;
  if (!s) return;
  const lm = lockMsg("s" + s.id); if (lm) return say("#formMsg", lm);
  if (s.needsPassword) {
    const e = pwError(pw, undefined, PW_MIN_STUDENT); if (e) return say("#formMsg", e);
    s.salt = randHex(16); s.iter = PBKDF2_ITER; s.hash = await pbkdf2(pw, s.salt, s.iter);
    delete s.needsPassword; save();
  } else if (await pbkdf2(pw, s.salt, s.iter) !== s.hash) {
    failed("s" + s.id); return say("#formMsg", lockMsg("s" + s.id) || T("errWrongPw"));
  }
  succeeded("s" + s.id); enterStudent(s);
 },
 async create(f) {
  if (!cryptoOK()) return say("#formMsg", T("errCrypto"));
  const nick = cleanNick(f.elements.nick.value), pw = f.elements.pw.value, pw2 = f.elements.pw2.value;
  const e = nickError(nick) || pwError(pw, pw2, PW_MIN_STUDENT);
  if (e) return say("#formMsg", e);
  if (!f.elements.consent.checked) return say("#formMsg", T("needConsent"));
  const salt = randHex(16);
  const s = {id: "s" + Date.now().toString(36) + randHex(3), name: nick, salt, iter: PBKDF2_ITER, hash: await pbkdf2(pw, salt), consent: true, created: Date.now()};
  db.students.push(s); save();
  enterStudent(s);
 },
 async rename(f) {
  const nick = cleanNick(f.elements.nick.value), s = me();
  const e = nickError(nick, s.id); if (e) return say("#formMsg", e);
  if (nick === s.name) return say("#formMsg", T("nicknameSaved"), "good");
  s.name = nick; s.renamePending = true; save(); chrome();
  say("#formMsg", T("nicknameSaved"), "good");
  if (navigator.onLine) syncNow(true);
 },
 async chpw(f) {
  const s = me(), cur = f.elements.cur.value, pw = f.elements.pw.value;
  const lm = lockMsg("s" + s.id); if (lm) return say("#formMsg", lm);
  if (await pbkdf2(cur, s.salt, s.iter) !== s.hash) { failed("s" + s.id); return say("#formMsg", T("errWrongPw")); }
  const e = pwError(pw, f.elements.pw2.value, PW_MIN_STUDENT); if (e) return say("#formMsg", e);
  succeeded("s" + s.id);
  s.salt = randHex(16); s.iter = PBKDF2_ITER; s.hash = await pbkdf2(pw, s.salt, s.iter); save();
  f.reset(); say("#formMsg", T("passwordSaved"), "good");
 },
 async delacc(f) {
  const s = me(), pw = f.elements.pw.value;
  const lm = lockMsg("s" + s.id); if (lm) return say("#formMsg", lm);
  if (await pbkdf2(pw, s.salt, s.iter) !== s.hash) { failed("s" + s.id); return say("#formMsg", T("errWrongPw")); }
  if (!confirm(T("confirmDeleteAcc"))) return;
  const id = s.id; session.sid = null; state.diag = state.practice = null;
  removeStudent(id); flash(T("accountDeleted")); go("welcome");
 },
 async tlogin(f) {
  if (!cryptoOK()) return say("#formMsg", T("errCrypto"));
  const lm = lockMsg("t"); if (lm) return say("#formMsg", lm);
  const salt = state.tGate.salt, th = await pbkdf2(f.elements.pw.value, salt), v = await sha256Hex(th);
  if (db.teacher) {
    if (v !== db.teacher.verifier) { failed("t"); return say("#formMsg", lockMsg("t") || T("wrongTeacherPw")); }
  } else {
    const j = await api({action:"class", th});
    if (!j.ok) { if (j.status === 401) failed("t"); return say("#formMsg", j.status === 401 ? T("wrongTeacherPw") : j.error); }
    db.teacher = {salt, verifier: v}; save(); state.remote = j.students;
  }
  succeeded("t"); session.teacher = true; session.th = th; touch(); go("teacher");
 },
 async tsetup(f) {
  if (!cryptoOK()) return say("#formMsg", T("errCrypto"));
  const pw = f.elements.pw.value, e = pwError(pw, f.elements.pw2.value, PW_MIN_TEACHER);
  if (e) return say("#formMsg", e);
  const salt = randHex(16), th = await pbkdf2(pw, salt);
  if (serverAvailable()) {
    const j = await api({action:"teacherSetup", salt, th, code: f.elements.code ? f.elements.code.value : ""});
    if (!j.ok) {
      if (j.status === 409) { await prepareTeacher(); flash(T("tExists")); return go("teacher"); }
      return say("#formMsg", j.error);
    }
  }
  db.teacher = {salt, verifier: await sha256Hex(th)}; save();
  session.teacher = true; session.th = th; touch(); flash(T("teacherCreated")); go("teacher");
 },
 async tchpw(f) {
  if (serverAvailable() && !navigator.onLine) return say("#formMsg", T("needTeacherOnline"));
  const lm = lockMsg("t"); if (lm) return say("#formMsg", lm);
  const cur = f.elements.cur.value, pw = f.elements.pw.value;
  const thOld = await pbkdf2(cur, db.teacher.salt);
  if (await sha256Hex(thOld) !== db.teacher.verifier) { failed("t"); return say("#formMsg", T("wrongTeacherPw")); }
  const e = pwError(pw, f.elements.pw2.value, PW_MIN_TEACHER); if (e) return say("#formMsg", e);
  const newSalt = randHex(16), newTh = await pbkdf2(pw, newSalt);
  if (serverAvailable()) {
    const j = await api({action:"teacherChangePassword", th: thOld, newSalt, newTh});
    if (!j.ok) return say("#formMsg", j.error);
  }
  db.teacher = {salt: newSalt, verifier: await sha256Hex(newTh)}; save(); session.th = newTh;
  f.reset(); say("#formMsg", T("tPwChanged"), "good");
 }
};

/* ---------- Learning actions ---------- */
function record(q, picked, mode) {
  const ok = picked === q.a;
  db.attempts.push({sid: session.sid, qid: q.id, topic: q.t, ok, mode, ts: Date.now(), synced: false});
  save(); netStatus();
  return ok;
}
function pickPracticeQuestion(topic) {
  const mine = myAttempts();
  const lastSeen = q => Math.max(0, ...mine.filter(a => a.qid === q.id).map(a => a.ts));
  return QS.filter(q => q.t === topic).sort((a, b) => lastSeen(a) - lastSeen(b))[0];   // least recently seen first
}
function loadPractice(topic) {
  const q = pickPracticeQuestion(topic);
  state.practice = {topic, qid: q.id, opts: shuffle(q.o), checked: false, ok: false};
  state.sel = null;
}
function speak() {
  if (!("speechSynthesis" in window)) { say("#formMsg", T("ttsMissing")); return; }
  const q = QS.find(x => x.id === (state.view === "diag" ? state.diag.order[state.diag.i] : state.practice.qid));
  const opts = state.view === "diag" ? state.diag.opts[state.diag.i] : state.practice.opts;
  const u = new SpeechSynthesisUtterance(tr(q.s) + " " + opts.join(", "));
  u.lang = {en:"en-IN", hi:"hi-IN", ta:"ta-IN"}[lang()];
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

["pointerdown", "keydown", "touchstart"].forEach(ev => document.addEventListener(ev, touch, {passive:true}));
setInterval(() => {                                   // auto log-out on idle
  if (Date.now() - session.last < IDLE_MS) return;

}, 15000);

document.addEventListener("submit", async e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const btn = f.querySelector("button[type=submit]"); if (btn) btn.disabled = true;
  try { await forms[f.dataset.form](f); }
  catch { say("#formMsg", T("netErr")); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.name === "opt") state.sel = +t.value;
  else if (t.matches("[data-showpw]")) t.closest("form").querySelectorAll("input[data-pw]").forEach(i => i.type = t.checked ? "text" : "password");
  else if (t.matches("[data-pick]")) { state.pickId = t.value; render(); }
  else if (t.id === "sortSel") { state.sort = t.value; $("#rosterBox").innerHTML = rosterHTML(); }
});
document.addEventListener("input", e => { if (e.target.id === "q") { state.q = e.target.value; $("#rosterBox").innerHTML = rosterHTML(); } });

document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) {
    const t = tab.dataset.tab;
    go(t === "welcome" ? (session.sid ? studentHome() : "welcome") : t);
    return;
  }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;

  if (act === "authTab") { state.authTab = b.dataset.auth; render(); }
  else if (act === "diagNext") {
    if (state.sel === null) { say("#formMsg", T("pickAnswer")); return; }
    const d = state.diag, q = QS.find(x => x.id === d.order[d.i]);
    record(q, d.opts[d.i][state.sel], "diagnostic");
    state.sel = null; d.i++;
    if (d.i >= d.order.length) go("results");
    else { render(); const l = app.querySelector("legend"); if (l) { l.tabIndex = -1; l.focus(); } }
  }
  else if (act === "practise") { loadPractice(b.dataset.topic); go("practice"); }
  else if (act === "check") {
    if (state.sel === null) { say("#formMsg", T("pickAnswer")); return; }
    const p = state.practice, q = QS.find(x => x.id === p.qid);
    p.ok = record(q, p.opts[state.sel], "practice"); p.checked = true; render();
  }
  else if (act === "practiceNext") {
    loadPractice(state.practice.topic); render();
    const l = app.querySelector("legend"); if (l) { l.tabIndex = -1; l.focus(); }
  }
  else if (act === "toResults") go("results");
  else if (act === "listen") speak();
  else if (act === "toggleDemo") { db.settings.demo = !db.settings.demo; save(); render(); }
  else if (act === "retryGate") { await prepareTeacher(); render(); }
  else if (act === "exportCsv") exportCSV();
  else if (act === "resetPw") {
    const s = db.students.find(x => x.id === b.dataset.id); if (!s) return;
    const pw = prompt(T("resetPrompt", {name: s.name}));
    if (pw === null) return;
    const err = pwError(pw, undefined, PW_MIN_STUDENT); if (err) { alert(err); return; }
    s.salt = randHex(16); s.iter = PBKDF2_ITER; s.hash = await pbkdf2(pw, s.salt, s.iter); delete s.needsPassword; save();
    flash(T("pwResetDone", {name: s.name})); render();
  }
  else if (act === "removeProfile") {
    const s = db.students.find(x => x.id === b.dataset.id); if (!s) return;
    if (!confirm(T("confirmRemove", {name: s.name}))) return;
    if (session.sid === s.id) { session.sid = null; state.diag = state.practice = null; }
    removeStudent(s.id); flash(T("removed")); render();
  }
  else if (act === "wipe") {
    if (confirm(T("confirmDelete"))) {
      // Remember which students to remove from the server copy too, then clear the device.
      const keep = {settings: db.settings, pendingDeletes: db.students.map(s => s.id).concat(db.pendingDeletes || [])};
      db = blank(); db.settings = keep.settings; db.pendingDeletes = keep.pendingDeletes; save();
      session.sid = null; session.teacher = false; session.th = null; state.diag = state.practice = state.remote = null;
      render(); say("#formMsg", T("deleted"), "good");
      if (navigator.onLine) syncNow(true);
    }
  }
});

$("#lang").addEventListener("change", e => { db.settings.lang = e.target.value; save(); render(); });
$("#btnContrast").addEventListener("click", () => { db.settings.contrast = !db.settings.contrast; save(); chrome(); });
$("#btnSmall").addEventListener("click", () => { db.settings.scale = Math.max(.9, +(db.settings.scale - .1).toFixed(1)); save(); chrome(); });
$("#btnLarge").addEventListener("click", () => { db.settings.scale = Math.min(1.5, +(db.settings.scale + .1).toFixed(1)); save(); chrome(); });
$("#btnSync").addEventListener("click", () => syncNow(false));
$("#btnProfile").addEventListener("click", () => go("profile"));
$("#btnLogout").addEventListener("click", () => { if (state.view === "teacher") lockTeacher(false); else logoutStudent(false); });
$("#skip").addEventListener("click", e => { e.preventDefault(); app.focus(); });
window.addEventListener("online", () => { netStatus(); syncNow(true); });
window.addEventListener("offline", () => { netStatus(); $("#syncMsg").textContent = T("syncOffline"); });

// "Install app" button (shown only when the browser offers installation)
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("#btnInstall").hidden = false; });
$("#btnInstall").addEventListener("click", async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("#btnInstall").hidden = true; });
window.addEventListener("appinstalled", () => { $("#btnInstall").hidden = true; });

/* ---------- Start ---------- */
render();
if (db.pendingDeletes.length && navigator.onLine) syncNow(true);
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

</script>
</body>
</html>
